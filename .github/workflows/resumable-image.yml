# Publishes this branch's image, the upstream server with the fix on the
# resumable-uploads branch, until upstream releases one that carries it.
# Triggered only by a tag resumable-*, never by upstream's v* or main.
name: resumable-image
on:
  push:
    tags:
      - "resumable-*"

permissions:
  contents: read
  packages: write

jobs:
  test-build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: test
        run: go test -count=1 ./...

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/michelfortes/fake-gcs-server:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/MichelFortes/fake-gcs-server
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=BSD-2-Clause
